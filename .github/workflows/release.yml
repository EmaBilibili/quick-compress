name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Linux x86_64 Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4, Libadwaita, FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev ffmpeg pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Binary (Release Mode)
        run: cargo build --release

      - name: Package Binary Artifact
        run: |
          cd target/release
          tar -czvf quick-compress-linux-x86_64.tar.gz quick-compress
          cp quick-compress quick-compress-x86_64

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/quick-compress-linux-x86_64.tar.gz
            target/release/quick-compress-x86_64
          draft: false
          prerelease: false
          generate_release_notes: true
